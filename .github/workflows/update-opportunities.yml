name: Update Tech Opportunities

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Opportunity Fetcher
        run: node fetch-opportunities.js

      - name: Commit and Push opportunities.json
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add opportunities.json
          git commit -m "Auto-update opportunities.json" || echo "No changes to commit"
          git push